<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>院内コール当直トレーニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --bg:#F5F6FA;
    --surface:#FFFFFF;
    --surface-2:#EAECF6;
    --ink:#171B34;
    --ink-soft:#565E82;
    --ink-faint:#8891B0;
    --line:#DCE0EF;
    --primary:#3C4B8C;
    --primary-strong:#262F5E;
    --primary-tint:#E6E9F7;
    --accent:#BC7A2E;
    --accent-tint:#FAEDDC;
    --good:#2E7D53;
    --good-tint:#E3F3EA;
    --warn:#BC7A2E;
    --warn-tint:#FAEDDC;
    --bad:#B23A3A;
    --bad-tint:#FBE7E5;
    --mono-bg:#171B34;
    --mono-ink:#D9DEF7;
    --mono-accent:#8FE3C7;
    --shadow: 0 1px 2px rgba(16,20,45,.06), 0 6px 20px rgba(16,20,45,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D0F1F;
      --surface:#161B33;
      --surface-2:#1E2340;
      --ink:#E9EBFA;
      --ink-soft:#A6ACD6;
      --ink-faint:#767CA8;
      --line:#2B3159;
      --primary:#8B98E8;
      --primary-strong:#B3BDF2;
      --primary-tint:#232A54;
      --accent:#E3A45D;
      --accent-tint:#392A14;
      --good:#6FC796;
      --good-tint:#16301F;
      --warn:#E3A45D;
      --warn-tint:#392A14;
      --bad:#E27C7C;
      --bad-tint:#3A1B1B;
      --mono-bg:#080A18;
      --mono-ink:#C9D0F5;
      --mono-accent:#7FF2D4;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D0F1F;
    --surface:#161B33;
    --surface-2:#1E2340;
    --ink:#E9EBFA;
    --ink-soft:#A6ACD6;
    --ink-faint:#767CA8;
    --line:#2B3159;
    --primary:#8B98E8;
    --primary-strong:#B3BDF2;
    --primary-tint:#232A54;
    --accent:#E3A45D;
    --accent-tint:#392A14;
    --good:#6FC796;
    --good-tint:#16301F;
    --warn:#E3A45D;
    --warn-tint:#392A14;
    --bad:#E27C7C;
    --bad-tint:#3A1B1B;
    --mono-bg:#080A18;
    --mono-ink:#C9D0F5;
    --mono-accent:#7FF2D4;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.65;
  }
  h1,h2,h3,.disp{
    font-family:"Zen Kaku Gothic New","BIZ UDPGothic",system-ui,sans-serif;
    text-wrap:balance;
    margin:0;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:14px 18px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .topbar .back{
    appearance:none; border:none; background:transparent; color:var(--primary);
    font-size:15px; font-weight:700; cursor:pointer; padding:6px 8px 6px 0;
    display:flex; align-items:center; gap:2px; min-height:44px;
    font-family:inherit;
  }
  .topbar .title{
    font-size:15px; font-weight:700; color:var(--ink-soft);
    letter-spacing:.02em;
    flex:1;
    text-align:center;
    margin-right:34px;
  }
  main{flex:1; padding:0 18px 48px;}

  /* ---------- HOME ---------- */
  .hero{ padding:28px 4px 18px; }
  .hero .eyebrow{
    font-size:12px; font-weight:700; letter-spacing:.14em; color:var(--primary);
    text-transform:uppercase;
  }
  .hero h1{ font-size:25px; font-weight:900; color:var(--ink); margin-top:8px; line-height:1.4; }
  .hero p{ color:var(--ink-soft); font-size:14px; margin-top:10px; max-width:44ch; }

  .progress-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; margin:14px 0 8px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:16px;
  }
  .progress-ring{ position:relative; width:56px; height:56px; flex:none;}
  .progress-ring svg{ transform:rotate(-90deg); }
  .progress-ring .pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--primary-strong);
  }
  .progress-text{flex:1;}
  .progress-text .num{font-size:13px; font-weight:700; color:var(--ink);}
  .progress-text .sub{font-size:12.5px; color:var(--ink-faint); margin-top:2px;}
  .review-pill-btn{
    appearance:none; border:1px solid var(--warn); background:var(--warn-tint); color:var(--warn);
    font-weight:700; font-size:12.5px; padding:8px 12px; border-radius:999px; cursor:pointer;
    white-space:nowrap; font-family:inherit;
  }
  .keitai-cta{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--primary-tint); border:1px solid var(--primary); border-radius:16px;
    padding:14px 18px; margin:10px 0 24px; cursor:pointer;
    width:100%; text-align:left; font-family:inherit; appearance:none;
  }
  .keitai-cta .t{display:block; font-size:14px; font-weight:700; color:var(--primary-strong);}
  .keitai-cta .s{display:block; font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .keitai-cta .arrow{color:var(--primary-strong); font-size:18px; flex:none;}

  .section-head{ display:flex; align-items:baseline; gap:8px; margin:26px 0 12px; }
  .section-head .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .section-head.urgent .dot{background:var(--bad);}
  .section-head.judgment .dot{background:var(--warn);}
  .section-head h2{font-size:15px; font-weight:700; color:var(--ink);}
  .section-head .count{font-size:12px; color:var(--ink-faint); font-weight:400;}

  .case-grid{ display:flex; flex-direction:column; gap:10px; }
  .case-card{
    display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px 14px; cursor:pointer; text-align:left; width:100%;
    box-shadow:var(--shadow); font-family:inherit;
    appearance:none;
  }
  .case-card:active{ transform:scale(.99); }
  .case-num{
    font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:13px;
    color:var(--ink-faint); width:26px; flex:none; font-variant-numeric:tabular-nums;
  }
  .case-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}
  .case-body .hint{
    font-size:14px; font-weight:600; color:var(--ink); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .status-chip{
    flex:none; align-self:flex-start; font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:999px;
    white-space:nowrap;
  }
  .status-chip.none{ background:var(--surface-2); color:var(--ink-faint); }
  .status-chip.good{ background:var(--good-tint); color:var(--good); }
  .status-chip.partial{ background:var(--warn-tint); color:var(--warn); }
  .status-chip.poor{ background:var(--bad-tint); color:var(--bad); }

  .empty-review{ text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:14px; }

  /* ---------- CASE VIEW ---------- */
  .case-hero{ padding:22px 0 4px; }
  .case-hero .tag{ font-size:12px; font-weight:700; color:var(--primary); letter-spacing:.08em; text-transform:uppercase;}
  .case-hero h1{ font-size:22px; font-weight:900; margin-top:8px; }

  .call-bubble{
    margin-top:16px; background:var(--primary-tint); border:1px solid var(--primary);
    border-radius:18px 18px 18px 4px; padding:16px 18px; box-shadow:var(--shadow);
    position:relative;
  }
  .call-bubble .cb-label{
    display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:var(--primary-strong); margin-bottom:8px;
  }
  .call-bubble .cb-label .phone-ico{
    width:16px; height:16px; flex:none;
  }
  .call-bubble p{ margin:0; font-size:15px; color:var(--ink); line-height:1.7; }
  .call-bubble p::before{ content:"\201C"; }
  .call-bubble p::after{ content:"\201D"; }

  .vignette{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; margin-top:12px; box-shadow:var(--shadow); font-size:14px; color:var(--ink-soft);
  }
  .vitals-mono{
    margin-top:10px; background:var(--mono-bg); border-radius:12px; padding:12px 14px;
    font-family:"JetBrains Mono",monospace; font-size:12.5px; color:var(--mono-ink);
    font-variant-numeric:tabular-nums; letter-spacing:.01em; line-height:1.7;
  }
  .vitals-mono .lbl{ color:var(--mono-accent); margin-right:8px; font-weight:700; }

  .prompt-block{ margin-top:22px; }
  .prompt-block label{ display:block; font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .prompt-block label .n{ color:var(--primary); margin-right:6px; }
  .prompt-block textarea{
    width:100%; min-height:88px; resize:vertical; border-radius:12px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:12px 14px; font-family:inherit; font-size:14px; line-height:1.6;
  }
  .prompt-block textarea:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  .prompt-block textarea::placeholder{ color:var(--ink-faint); }

  .reveal-btn{
    width:100%; margin-top:24px; appearance:none; border:none; cursor:pointer;
    background:var(--primary); color:#fff; font-weight:700; font-size:15px;
    padding:15px; border-radius:14px; font-family:inherit;
    box-shadow:0 4px 14px rgba(60,75,140,.32);
  }
  .reveal-btn:active{ transform:scale(.99); }

  .answer-wrap{ margin-top:28px; }
  .diagnosis-reveal{
    background:var(--primary-tint); border:1.5px solid var(--primary); border-radius:16px;
    padding:18px 20px; margin-bottom:20px; text-align:center;
  }
  .diagnosis-reveal .dr-eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--primary-strong);
  }
  .diagnosis-reveal .dr-title{
    font-family:"Zen Kaku Gothic New","BIZ UDPGothic",sans-serif; font-size:20px; font-weight:900;
    margin-top:6px; color:var(--ink);
  }
  .diagnosis-reveal .dr-sub{ font-size:12.5px; margin-top:6px; color:var(--ink-soft); }
  .verdict-badge{
    display:inline-flex; align-items:center; gap:6px; margin-top:12px;
    font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:999px;
  }
  .verdict-badge.go{ background:var(--bad-tint); color:var(--bad); }
  .verdict-badge.phone{ background:var(--warn-tint); color:var(--warn); }

  .answer-wrap .divider{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .answer-wrap .divider .line{ flex:1; height:1px; background:var(--line); }
  .answer-wrap .divider span{ font-size:12px; font-weight:700; color:var(--ink-faint); letter-spacing:.08em;}

  .answer-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:18px 20px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .answer-card h3{ font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .answer-card h3 .ico{
    width:22px;height:22px;border-radius:7px;flex:none; display:flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:900; color:#fff;
  }
  .ico.check{background:var(--primary);}
  .ico.danger{background:var(--bad);}
  .ico.tests{background:var(--accent);}
  .answer-card ul{ margin:0; padding-left:20px; font-size:14px; color:var(--ink); }
  .answer-card li{ margin-bottom:6px; }
  .answer-card li:last-child{ margin-bottom:0; }
  mark{
    background:var(--accent-tint); color:var(--accent); padding:1px 5px; border-radius:5px;
    font-weight:700; box-decoration-break:clone; -webkit-box-decoration-break:clone;
  }

  .pearl-block{
    background:var(--surface-2); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; margin-bottom:20px;
  }
  .pearl-block .pb-label{
    font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--ink-faint);
    text-transform:uppercase; margin-bottom:8px;
  }
  .pearl-block ul{ margin:0; padding-left:18px; font-size:13.5px; color:var(--ink-soft); line-height:1.6; }
  .pearl-block li{ margin-bottom:6px; }
  .pearl-block li:last-child{ margin-bottom:0; }

  .refs-block{ margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); }
  .refs-block h4{ font-size:12px; font-weight:700; color:var(--ink-faint); letter-spacing:.06em; margin-bottom:8px; }
  .refs-block ol{ margin:0; padding-left:19px; font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
  .refs-block li{ margin-bottom:7px; }
  .refs-block li:last-child{ margin-bottom:0; }
  .refs-block a{ color:var(--ink-soft); text-decoration:underline; text-underline-offset:2px; word-break:break-all; }
  .refs-block a:hover{ color:var(--primary); }

  .assess-block{ margin-top:26px; }
  .assess-block .q{ font-size:14px; font-weight:700; margin-bottom:12px; text-align:center; }
  .assess-row{ display:flex; gap:8px; }
  .assess-btn{
    flex:1; appearance:none; cursor:pointer; border-radius:12px; padding:13px 6px;
    font-family:inherit; font-size:12.5px; font-weight:700; line-height:1.4;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft);
  }
  .assess-btn.good{ border-color:var(--good); }
  .assess-btn.partial{ border-color:var(--warn); }
  .assess-btn.poor{ border-color:var(--bad); }
  .assess-btn.good.active{ background:var(--good); color:#fff; }
  .assess-btn.partial.active{ background:var(--warn); color:#fff; }
  .assess-btn.poor.active{ background:var(--bad); color:#fff; }
  .save-warning{
    margin-top:12px; padding:10px 14px; border-radius:10px;
    background:var(--bad-tint); color:var(--bad); font-size:12.5px; font-weight:600; line-height:1.5;
  }

  .after-assess{ margin-top:22px; display:flex; flex-direction:column; gap:10px; animation:fadein .3s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .nav-btn{
    appearance:none; border:none; cursor:pointer; border-radius:12px; padding:14px;
    font-family:inherit; font-size:14.5px; font-weight:700; text-align:center;
  }
  .nav-btn.primary{ background:var(--primary); color:#fff; }
  .nav-btn.ghost{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }

  /* ---------- KEITAI (PATTERN) VIEW ---------- */
  .keitai-hero{ padding:24px 0 6px; }
  .keitai-hero .eyebrow{ font-size:12px; font-weight:700; color:var(--primary); letter-spacing:.1em; text-transform:uppercase;}
  .keitai-hero h1{ font-size:21px; font-weight:900; margin-top:8px; }
  .keitai-hero p{ font-size:13.5px; color:var(--ink-soft); margin-top:8px; }

  .escalation-note{
    margin-top:18px; padding:16px 18px; border-radius:14px;
    background:var(--accent-tint); border:1.5px solid var(--accent);
  }
  .escalation-note .en-label{
    font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--accent); text-transform:uppercase;
  }
  .escalation-note .en-body{ font-size:13.5px; color:var(--ink); margin-top:6px; line-height:1.6; }

  .flow{ margin-top:22px; position:relative; }
  .flow-step{ display:flex; gap:14px; position:relative; padding-bottom:22px; }
  .flow-step:last-child{ padding-bottom:0; }
  .flow-step .rail{ display:flex; flex-direction:column; align-items:center; flex:none; }
  .flow-step .node{
    width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px;
    font-family:"Zen Kaku Gothic New",sans-serif; flex:none; z-index:1;
  }
  .flow-step .stem{ width:2px; flex:1; background:var(--line); margin-top:2px; }
  .flow-step .content{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); margin-top:1px;}
  .flow-step .content h3{ font-size:14.5px; font-weight:700; }
  .flow-step .content p{ font-size:13px; color:var(--ink-soft); margin-top:5px; }

  .keitai-foot{
    margin-top:26px; padding:16px 18px; background:var(--primary-tint); border-radius:14px;
    font-size:13px; color:var(--primary-strong); text-align:center; font-weight:700;
  }

  a{color:var(--primary);}
  button:focus-visible, textarea:focus-visible, .case-card:focus-visible{
    outline:2px solid var(--primary); outline-offset:2px;
  }

  @media (hover:hover){
    .case-card:hover{ border-color:var(--primary); }
    .keitai-cta:hover{ background:var(--primary-tint); filter:brightness(0.97); }
    .review-pill-btn:hover{ filter:brightness(0.95); }
    .reveal-btn:hover{ filter:brightness(1.08); }
    .assess-btn:hover{ border-color:var(--primary); }
    .nav-btn.primary:hover{ filter:brightness(1.08); }
    .nav-btn.ghost:hover{ border-color:var(--primary); }
    .topbar .back:hover{ text-decoration:underline; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
  "use strict";

  var CASES = [
    {
      id:"chest_pain", num:1, cat:"urgent", tag:"循環器",
      title:"ステント血栓症・再梗塞の疑い",
      hint:"68歳男性・NSTEMI後PCI後3日目・締め付けられるような胸痛",
      call:"先生、501号室の患者さんが、10分前から胸が締め付けられるように痛いと訴えています。冷や汗もかいているようです。",
      background:"68歳男性。3日前に非ST上昇型心筋梗塞(NSTEMI)に対しPCI(経皮的冠動脈インターベンション)を施行し、リハビリ中。",
      vitals:"BP 148/92　HR 102　RR 20　SpO2 94%(room air)　冷汗あり",
      verdict:"go", verdictLabel:"直ちに訪室",
      answer:{
        check:[
          "痛みの性状(締め付け・圧迫感)・持続時間・<mark>放散痛の有無</mark>(頸部・左肩・背部)",
          "<mark>バイタルサイン全項目</mark>(左右の血圧差も含む)、冷汗・悪心の有無",
          "<mark>抗血小板薬(アスピリン・P2Y12阻害薬)の直近の内服状況</mark>ー自己中断や周術期の休薬がないか(DAPT中断はステント血栓症の最大の危険因子)",
          "その場で12誘導心電図とパルスオキシメトリーの指示を出し、可能なら結果を電話で読み上げてもらう"
        ],
        danger:[
          "<mark>ステント血栓症・再梗塞</mark>による突然の完全閉塞は、致死的不整脈やショックに至りうる",
          "<mark>DAPT(二剤抗血小板療法)の自己中断・休薬</mark>があれば、ステント血栓症のリスクが跳ね上がる",
          "痛みの程度が軽くても心電図変化が先行することがあり、<mark>症状の強さだけで否定できない</mark>",
          "背部への放散痛や血圧の左右差があれば<mark>大動脈解離</mark>も鑑別に挙げる"
        ],

    html += assessBtn("good","自力で言えた", cur);
    html += assessBtn("partial","一部抜けた", cur);
    html += assessBtn("poor","ほぼ言えなかった", cur);
    html += '</div>';
    if(cur && lastSaveFailed){
      html += '<div class="save-warning">⚠ この端末には保存できませんでした。プライベートブラウズ中か、ストレージが無効になっている可能性があります。この記録はこの画面を離れると失われます。</div>';
    }
    html += '</div>';

    if(cur){
      html += '<div class="after-assess">';
      html += '<button class="nav-btn primary" data-action="next-case">次の症例へ</button>';
      html += '<button class="nav-btn ghost" data-action="goto-home">一覧に戻る</button>';
      html += '</div>';
    }

    return html;
  }

  function answerCard(kind, label, items){
    var iconChar = kind==="check" ? "1" : kind==="danger" ? "!" : "2";
    return '<div class="answer-card"><h3><span class="ico '+kind+'">'+iconChar+'</span>'+label+'</h3>'+
      '<ul>'+items.map(function(t){return '<li>'+t+'</li>';}).join("")+'</ul></div>';
  }

  // Optional summary bullets (c.pearl, array of strings) giving background/mechanism beyond
  // the three self-test cards. Omitted entirely if a case has no pearl content.
  function renderPearl(c){
    if(!c.pearl || !c.pearl.length) return "";
    var items = c.pearl.map(function(t){ return '<li>'+t+'</li>'; }).join("");
    return '<div class="pearl-block"><div class="pb-label">症例のまとめ</div><ul>'+items+'</ul></div>';
  }

  // Per-case reference list is optional data (c.refs). Cases without reliable/relevant
  // citations simply omit the field — this renders nothing rather than forcing a section.
  function renderRefs(c){
    if(!c.refs || !c.refs.length) return "";
    var items = c.refs.map(refEntryHtml).join("");
    return '<div class="refs-block"><h4>参考</h4><ol>'+items+'</ol></div>';
  }

  function refEntryHtml(r){
    var citationParts = [];
    if(r.author) citationParts.push(escapeHtml(r.author));
    if(r.title) citationParts.push(escapeHtml(r.title));
    var pub = [];
    if(r.source) pub.push(escapeHtml(r.source));
    if(r.year) pub.push(escapeHtml(String(r.year)));
    if(pub.length) citationParts.push(pub.join(" "));
    var text = citationParts.join("．");
    var linkHtml = "";
    if(r.url){
      linkHtml = '<br><a href="'+escapeHtml(r.url)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(r.url)+'</a>';
    }
    return '<li>'+text+linkHtml+'</li>';
  }

  function assessBtn(kind, label, cur){
    return '<button class="assess-btn '+kind+(cur===kind?' active':'')+'" data-action="assess" data-kind="'+kind+'">'+label+'</button>';
  }

  /* ---------------- RENDER: KEITAI ---------------- */
  function renderKeitai(){
    var html = "";
    html += '<div class="keitai-hero"><div class="eyebrow">コール対応の型</div><h1>どんな内容のコールでも、まずこの順番で考える</h1><p>コールの内容が何であれ、当直対応の初動はこの5ステップが基本の型になります。症例ごとの知識より先に、この流れを体に染み込ませましょう。</p></div>';
    html += '<div class="escalation-note"><div class="en-label">⚡ いつでも・早ければ早いほど</div><div class="en-body">上級医への相談はこの流れの「最後」ではありません。判断に迷う・重症感がある時点で、<mark>指示を決め切るより先に</mark>共有してください。一人で抱え込まないこと自体が初動の一部です。</div></div>';
    html += '<div class="flow">';
    FLOW.forEach(function(f,i){
      html += '<div class="flow-step">';
      html += '<div class="rail"><div class="node">'+(i+1)+'</div>'+(i<FLOW.length-1?'<div class="stem"></div>':'')+'</div>';
      html += '<div class="content"><h3>'+f.t+'</h3><p>'+f.d+'</p></div>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="keitai-foot">迷ったら、この5つに立ち返る。</div>';
    return html;
  }

  /* ---------------- MASTER RENDER ---------------- */
  function render(){
    var topbarHtml, mainHtml;

    if(state.view==="home"){
      topbarHtml = state.reviewOnly
        ? '<button class="back" data-action="goto-home-full">‹ 一覧</button><div class="title">復習リスト</div>'
        : '<div class="title">院内コール当直トレーニング</div>';
      mainHtml = renderHome();
    } else if(state.view==="case"){
      var c = caseById(state.caseId);
      if(!c){
        // Unknown/stale case id (should not happen via normal UI navigation, but never
        // let a bad id crash the whole render — fall back to the home screen instead).
        state.view = "home";
        state.caseId = null;
        return render();
      }
      var numStr = (c.num<10?"0":"")+c.num;
      topbarHtml = '<button class="back" data-action="goto-home">‹ 一覧</button><div class="title">症例 '+numStr+'</div>';
      mainHtml = renderCase(c);
    } else if(state.view==="keitai"){
      topbarHtml = '<button class="back" data-action="goto-home">‹ 一覧</button><div class="title">コール対応の型</div>';
      mainHtml = renderKeitai();
    }

    app.innerHTML = '<div class="topbar">'+topbarHtml+'</div><main>'+mainHtml+'</main>';
    bindEvents();
  }

  /* ---------------- EVENTS ---------------- */
  // When in review mode, "次の症例へ" should walk the review queue, not the full case list —
  // otherwise the whole point of filtering down to just the cases that need another pass is
  // lost the moment you finish the first one. Falls back to the full list if the review
  // queue is empty (e.g. the case just answered was the last one still needing review).
  function nextCaseAfter(current){
    var pool = state.reviewOnly ? reviewCases() : CASES;
    if(pool.length === 0){ pool = CASES; }
    var idx = -1;
    for(var i=0;i<pool.length;i++){ if(pool[i].id===current.id){ idx = i; break; } }
    return idx === -1 ? pool[0] : pool[(idx+1) % pool.length];
  }

  function bindEvents(){
    app.querySelectorAll("[data-action]").forEach(function(el){
      el.addEventListener("click", function(){
        var action = el.getAttribute("data-action");
        if(action==="open-case"){
          revealCache[el.getAttribute("data-id")] = false;
          delete pendingStatus[el.getAttribute("data-id")];
          lastSaveFailed = false;
          go("case", el.getAttribute("data-id"));
        } else if(action==="goto-home"){
          // Keep whatever reviewOnly state we already had — a user backing out of a case
          // they opened from the review list should land back in the review list, not be
          // silently dropped into the full case list.
          go("home");
        } else if(action==="goto-home-full"){
          state.reviewOnly = false;
          render();
        } else if(action==="toggle-review"){
          state.reviewOnly = true;
          render();
        } else if(action==="goto-keitai"){
          go("keitai");
        } else if(action==="reveal"){
          collectDraft(state.caseId, true);
          revealCache[state.caseId] = true;
          render();
          var wrap = app.querySelector(".answer-wrap");
          if(wrap) wrap.scrollIntoView({behavior:"smooth", block:"start"});
        } else if(action==="assess"){
          var kind = el.getAttribute("data-kind");
          var c0 = caseById(state.caseId);
          if(!c0) return;
          pendingStatus[state.caseId] = kind;
          state.progress[state.caseId] = kind;
          lastSaveFailed = !saveProgress(state.progress);
          render();
        } else if(action==="next-case"){
          var c = caseById(state.caseId);
          if(!c) return;
          var next = nextCaseAfter(c);
          revealCache[next.id] = false;
          delete pendingStatus[next.id];
          go("case", next.id);
        }
      });
    });

    app.querySelectorAll("textarea[data-field]").forEach(function(ta){
      ta.addEventListener("input", function(){
        collectDraft(state.caseId, false);
      });
    });
  }

  var draftSaveTimer = null;
  function collectDraft(caseId, flushNow){
    var d = {};
    app.querySelectorAll("textarea[data-field]").forEach(function(ta){
      d[ta.getAttribute("data-field")] = ta.value;
    });
    draftCache[caseId] = d;
    if(draftSaveTimer){ clearTimeout(draftSaveTimer); draftSaveTimer = null; }
    if(flushNow){
      saveDrafts(draftCache);
    } else {
      draftSaveTimer = setTimeout(function(){ saveDrafts(draftCache); }, 400);
    }
  }
  // Best-effort: flush any pending debounced draft save if the tab is closed/backgrounded
  // before the timer fires (mobile browsers routinely discard backgrounded tabs).
  window.addEventListener("pagehide", function(){ saveDrafts(draftCache); });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden") saveDrafts(draftCache);
  });

  render();
})();
</script>
</body>
</html>
